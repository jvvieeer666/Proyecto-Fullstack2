<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro | LEVEL-UP GAMER</title>

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- CSS Principal -->
    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>

    <!-- =========================
    HEADER
    ========================= -->
    <header>
        <h1>LEVEL-UP GAMER</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#productos">Productos</a>
            <a href="index.html#nosotros">Nosotros</a>
            <a href="blogs.html">Blogs</a>
            <a href="contacto.html">Contacto</a>
        </nav>
        <div class="carrito">
            🛒 Cart (<span id="contador-carrito">0</span>)
        </div>
        <div class="login">
            <a href="inicio_sesion.html" class="btn-login">👤 Iniciar sesión</a>
        </div>
    </header>

    <!-- =========================
    REGISTRO
    ========================= -->
    <main>
        <section class="registro-contenedor">
            <div class="registro">

                <h2>🚀 REGISTRO</h2>
                <p class="subtitulo">Crea tu cuenta y sube de nivel</p>

                <form id="formRegistro" action="#" method="POST">

                    <!-- NOMBRE -->
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" required>

                    <!-- CORREO -->
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com" required>

                    <!-- TELÉFONO -->
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="+56 9 1234 5678">

                    <!-- CONTRASEÑA -->
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" minlength="8" required>

                    <!-- CONFIRMAR CONTRASEÑA -->
                    <label for="confirmPassword">Confirmar contraseña</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repite tu contraseña" required>

                    <!-- REGIÓN -->
                    <label for="region">Región</label>
                    <select id="region" name="region" required>
                        <option value="">Selecciona tu región</option>
                        <option value="rm">Región Metropolitana</option>
                        <option value="v">Región de Valparaíso</option>
                        <option value="viii">Región del Biobío</option>
                        <option value="ix">Región de La Araucanía</option>
                        <option value="x">Región de Los Lagos</option>
                        <option value="i">Región de Tarapacá</option>
                        <option value="ii">Región de Antofagasta</option>
                        <option value="iii">Región de Atacama</option>
                        <option value="iv">Región de Coquimbo</option>
                        <option value="vi">Región del Libertador Bernardo O'Higgins</option>
                        <option value="vii">Región del Maule</option>
                        <option value="xi">Región de Aysén</option>
                        <option value="xii">Región de Magallanes</option>
                        <option value="xiv">Región de Los Ríos</option>
                        <option value="xv">Región de Arica y Parinacota</option>
                        <option value="xvi">Región de Ñuble</option>
                    </select>

                    <!-- COMUNA -->
                    <label for="comuna">Comuna</label>
                    <input type="text" id="comuna" name="comuna" placeholder="Ej: Santiago, Viña del Mar" required>

                    <!-- TÉRMINOS Y CONDICIONES -->
                    <div class="terminos">
                        <input type="checkbox" id="terminos" name="terminos" required>
                        <label for="terminos">Acepto los <a href="#">términos y condiciones</a></label>
                    </div>

                    <!-- BOTÓN REGISTRARSE -->
                    <button type="submit">REGISTRARSE 🎮</button>

                    <!-- ENLACE A INICIAR SESIÓN -->
                    <div class="login-link">
                        ¿Ya tienes cuenta? <a href="inicio_sesion.html">Inicia sesión</a>
                    </div>

                </form>

            </div>
        </section>
    </main>

    <!-- =========================
    FOOTER
    ========================= -->
    <footer>
        <p>© 2026 LEVEL-UP GAMER</p>
        <p>🎮 Juega. Personaliza. Disfruta. Sube de nivel.</p>
    </footer>

    <!-- =========================
    JAVASCRIPT (OPCIONAL)
    ========================= -->

    <script src="js/registro.js"></script>
</body>

</html>
